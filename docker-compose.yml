services:
  crystalica:
    build:
      context: .
      args:
        PUBLIC_CLERK_PUBLISHABLE_KEY: ${PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    image: ghcr.io/pirvudanielcatalin/crystalica:local
    env_file:
      - path: .env
        required: false
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      PUBLIC_CLERK_PUBLISHABLE_KEY: ${PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    ports:
      - "${APP_PORT:-4321}:4321"
    restart: unless-stopped
    networks:
      - crystalica
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          memory: 256m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4321/').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

networks:
  crystalica:
    name: crystalica
