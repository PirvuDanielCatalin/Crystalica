<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#e6f3ff;stop-opacity:0.8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#f0f8ff"/>
  <polygon points="256,80 150,450 362,450" fill="url(#crystalGrad)" stroke="rgba(200,220,255,0.8)" stroke-width="6" filter="url(#glow)"/>
  <circle cx="180" cy="150" r="25" fill="rgba(255,255,255,0.7)"/>
  <circle cx="290" cy="180" r="15" fill="rgba(255,255,255,0.6)"/>
  <text x="256" y="500" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#5a7d9a">Cristal de Stâncă</text>
</svg>
